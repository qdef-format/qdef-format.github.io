<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QDEF Validator — QDEF</title>
  <meta name="description" content="Validate and inspect hex-encoded QDEF payloads — check magic header, parse CBOR, verify Record structure.">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.0/dist/iife/reader/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    #scanOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    #scanOverlay.hidden { display: none; }
    #scanOverlay .scan-box {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 16px; color: #fff; width: min(480px, 96vw);
    }
    #scanOverlay video { width: 100%; max-height: 50vh; object-fit: cover;
                         border-radius: 8px; background: #000; }
    #scanOverlay canvas { display: none; }
    #scanStatus { font-size: 0.9rem; color: #ccc; text-align: center; margin: 0; }

    .qr-dropzone {
      margin-top: 10px; padding: 10px; border: 2px dashed var(--border);
      border-radius: var(--radius); font-size: 0.85rem; color: var(--text-muted);
      cursor: pointer; text-align: center; transition: border-color .15s, background-color .15s;
    }
    .qr-dropzone.dragover { border-color: var(--accent); background: var(--accent-bg, #f0f0ff); }
    .qr-dropzone label { cursor: pointer; display: block; }
    .qr-dropzone input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <a href="../index.html" class="logo"><img src="../assets/logo-white.png" alt="QDEF" width="36" height="36" style="vertical-align:middle"></a>
      <nav>
        <a href="../index.html">Home</a>
        <a href="../spec.html">Spec</a>
        <a href="../examples.html">Examples</a>
        <a href="../implementations.html">Implementations</a>
        <a href="../related-work.html">Related Work</a>
        <a href="../tools/validator.html">Validator</a>
        <a href="../registry.html">Registry</a>
      </nav>
    </div>
  </header>

  <div id="scanOverlay" class="hidden">
    <div class="scan-box">
      <video id="scanVideo" autoplay playsinline muted></video>
      <canvas id="scanCanvas"></canvas>
      <p id="scanStatus">Point camera at a QDEF QR code.</p>
      <button class="btn" style="background:#6c757d" id="btnStopScan">Cancel</button>
    </div>
  </div>

  <main class="container">
    <h1>QDEF Validator</h1>
    <p>Paste hex, scan a QR code, or drop a QR image to validate a QDEF payload.</p>

    <div class="validator-section">
      <label for="hex-input"><strong>Hex-encoded payload:</strong></label>
      <textarea id="hex-input" placeholder="Paste hex bytes here... e.g. 51 44 45 46 82 18 64 ..."></textarea>
      <div style="margin-top:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap">
        <button class="btn" onclick="validateQDEPayload(document.getElementById('hex-input').value)">Validate</button>
        <button class="btn" style="background:#6c757d" onclick="document.getElementById('hex-input').value='';document.getElementById('validator-output').classList.remove('visible')">Clear</button>
        <button class="btn" id="btnScan" style="background:#1a7a1a">📷 Scan QR</button>
        <select id="example-select" onchange="loadExample()" style="padding:0.5rem 0.75rem;border:1.5px solid var(--border);border-radius:var(--radius);font-size:0.9rem;background:var(--surface);color:var(--text);cursor:pointer">
          <option value="">Load an example…</option>
        </select>
      </div>
      <div class="qr-dropzone" id="qrDropZone">
        <label>
          <input type="file" id="qrFileInput" accept="image/*">
          Drop a QR code image, paste from clipboard, or <u>choose file</u>
        </label>
      </div>
    </div>

    <div id="validator-output">
      <div id="validation-result" class="validation-result"></div>
      <div id="cbor-tree" class="tree"></div>
      <div id="qr-section" style="margin-top:1.5rem;display:none">
        <h3 style="margin-bottom:0.5rem">QR Code</h3>
        <div style="display:flex;align-items:start;gap:1rem;flex-wrap:wrap">
          <div id="qr-canvas-wrapper" style="background:#fff;padding:12px;border-radius:var(--radius);display:inline-block"></div>
          <div id="qr-info" style="font-size:0.85rem;color:var(--text-muted);max-width:300px"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>QDEF &mdash; Quick Data Exchange Format &bull; <a href="https://github.com/qdef-format/qdef">GitHub</a></p>
  </footer>

  <script src="../assets/registry-data.js"></script>
  <script src="validator.js"></script>
</body>
</html>
